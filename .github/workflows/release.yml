name: Build and publish RecRoll

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Source revision"
        required: false
        default: "main"
      kuroko_ref:
        description: "Licensing revision"
        required: false
        default: ""
      release_tag:
        description: "Release tag"
        required: false
        default: ""
      sign_pace:
        type: choice
        required: false
        default: "auto"
        options: [ "auto", "on", "off" ]
      sign_binary:
        type: choice
        required: false
        default: "auto"
        options: [ "auto", "on", "off" ]
      platforms:
        type: choice
        required: false
        default: "both"
        options: [ "both", "windows", "macos" ]
      replace_existing:
        type: boolean
        required: false
        default: false
      prerelease:
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [ recroll-release ]

permissions:
  contents: read

env:
  SOURCE_REF: ${{ inputs.source_ref || github.event.client_payload.source_ref || 'main' }}
  RELEASE_TAG: ${{ inputs.release_tag || github.event.client_payload.release_tag || '' }}
  RECROLL_SIGN_PACE: ${{ inputs.sign_pace || github.event.client_payload.sign_pace || 'auto' }}
  RECROLL_SIGN_BINARY: ${{ inputs.sign_binary || github.event.client_payload.sign_binary || 'auto' }}
  PLATFORMS: ${{ inputs.platforms || github.event.client_payload.platforms || 'both' }}

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/guard_no_source.sh

  windows:
    name: Windows
    needs: guard
    if: ${{ (inputs.platforms || github.event.client_payload.platforms || 'both') != 'macos' }}
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        shell: bash
        env:
          CONFIG_KEY: ${{ secrets.CONFIG_KEY }}
          VARS_RAW: ${{ toJson(vars) }}
        run: python3 scripts/load_env.py

      - name: Clone source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ env.SOURCE_TOKEN }}
          path: src
          submodules: recursive
          persist-credentials: false

      - name: Select licensing revision
        shell: bash
        env:
          REQUESTED_KUROKO_REF: ${{ inputs.kuroko_ref || github.event.client_payload.kuroko_ref }}
        run: |
          ref="${REQUESTED_KUROKO_REF:-}"
          if [ -z "$ref" ] && [ -f "src/KUROKO_REVISION" ]; then
            ref="$(tr -d '\r\n' < "src/KUROKO_REVISION")"
          fi
          ref="${ref:-${KUROKO_REF:-main}}"
          git check-ref-format --allow-onelevel "$ref" >/dev/null || { echo "::error::Invalid revision"; exit 1; }
          printf 'KUROKO_BUILD_REF=%s\n' "$ref" >> "$GITHUB_ENV"

      - name: Clone licensing client
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KUROKO_REPO }}
          ref: ${{ env.KUROKO_BUILD_REF }}
          token: ${{ env.CLIENT_TOKEN }}
          path: kuroko
          persist-credentials: false

      - name: Install Inno Setup
        timeout-minutes: 5
        run: choco install innosetup --no-progress

      - name: Record build metadata
        shell: pwsh
        working-directory: src
        run: |
          $sha = git rev-parse HEAD
          @(
            "SOURCE_SHA=$sha",
            "RECROLL_SOURCE_SHA=$sha"
          ) | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and package
        shell: pwsh
        timeout-minutes: 80
        run: |
          $ErrorActionPreference = "Continue"
          $status = Join-Path $PWD "build-exit.txt"
          Remove-Item $status -ErrorAction SilentlyContinue

          & pwsh -NoProfile -File scripts/run_private_build.ps1 `
              -Script src/ci/build_windows.ps1 -StatusFile $status 2>&1 |
            ForEach-Object { $_.ToString() } |
            python scripts/redact_log.py

          if (-not (Test-Path $status)) {
            throw "Build wrapper did not record a status."
          }
          $code = [int](Get-Content $status)
          if ($code -ne 0) {
            throw "Build failed."
          }

      - name: Collect deliverables
        shell: bash
        run: ./scripts/collect_public_artifacts.sh src/dist public-dist windows

      - name: Clean source
        if: always()
        shell: bash
        run: |
          rm -rf src kuroko build-exit.txt
          for leftover in src kuroko; do
            if [ -e "${leftover}" ]; then
              echo "::error::${leftover} still exists."
              exit 1
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RecRoll-Windows-Installers
          path: public-dist/*
          if-no-files-found: error

  macos:
    name: macOS
    needs: guard
    if: ${{ (inputs.platforms || github.event.client_payload.platforms || 'both') != 'windows' }}
    runs-on: macos-14
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Configure environment
        shell: bash
        env:
          CONFIG_KEY: ${{ secrets.CONFIG_KEY }}
          VARS_RAW: ${{ toJson(vars) }}
        run: python3 scripts/load_env.py

      - name: Clone source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ env.SOURCE_TOKEN }}
          path: src
          submodules: recursive
          persist-credentials: false

      - name: Select licensing revision
        shell: bash
        env:
          REQUESTED_KUROKO_REF: ${{ inputs.kuroko_ref || github.event.client_payload.kuroko_ref }}
        run: |
          ref="${REQUESTED_KUROKO_REF:-}"
          if [ -z "$ref" ] && [ -f "src/KUROKO_REVISION" ]; then
            ref="$(tr -d '\r\n' < "src/KUROKO_REVISION")"
          fi
          ref="${ref:-${KUROKO_REF:-main}}"
          git check-ref-format --allow-onelevel "$ref" >/dev/null || { echo "::error::Invalid revision"; exit 1; }
          printf 'KUROKO_BUILD_REF=%s\n' "$ref" >> "$GITHUB_ENV"

      - name: Clone licensing client
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KUROKO_REPO }}
          ref: ${{ env.KUROKO_BUILD_REF }}
          token: ${{ env.CLIENT_TOKEN }}
          path: kuroko
          persist-credentials: false

      - name: Record build metadata
        working-directory: src
        run: |
          SHA="$(git rev-parse HEAD)"
          {
            echo "SOURCE_SHA=${SHA}"
            echo "RECROLL_SOURCE_SHA=${SHA}"
          } >> "$GITHUB_ENV"

      - name: Build and package
        timeout-minutes: 110
        run: |
          set +e
          ./src/ci/build_macos.sh 2>&1 | python3 scripts/redact_log.py
          status=${PIPESTATUS[0]}
          if [ "${status}" -ne 0 ]; then
            echo "Build failed." >&2
            exit "${status}"
          fi

      - name: Collect deliverables
        run: ./scripts/collect_public_artifacts.sh src/dist public-dist macos

      - name: Clean source
        if: always()
        run: |
          rm -rf src kuroko
          for leftover in src kuroko; do
            if [ -e "${leftover}" ]; then
              echo "::error::${leftover} still exists."
              exit 1
            fi
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RecRoll-macOS-DMG
          path: public-dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: [ windows, macos ]
    if: ${{ always() && (needs.windows.result == 'success' || needs.macos.result == 'success') && (inputs.release_tag || github.event.client_payload.release_tag) != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Gather deliverables
        run: |
          mkdir -p release-files
          find downloaded -type f -exec cp {} release-files/ \;

      - name: Verify payload
        run: ./scripts/verify_public_payload.sh release-files

      - name: Compose release notes
        id: notes
        env:
          TAG: ${{ env.RELEASE_TAG }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          HAVE_WINDOWS_EXE=no; HAVE_WINDOWS_MSI=no; HAVE_MACOS=no
          ls release-files/RecRoll-*-Installer.exe >/dev/null 2>&1 && HAVE_WINDOWS_EXE=yes
          ls release-files/*.msi >/dev/null 2>&1 && HAVE_WINDOWS_MSI=yes
          ls release-files/*.dmg >/dev/null 2>&1 && HAVE_MACOS=yes

          INCOMPLETE=no
          [ "${WINDOWS_RESULT}" = "failure" ] && INCOMPLETE=yes
          [ "${MACOS_RESULT}" = "failure" ] && INCOMPLETE=yes
          echo "incomplete=${INCOMPLETE}" >> "$GITHUB_OUTPUT"

          {
            echo "## RecRoll ${TAG}"
            echo
            if [ "${INCOMPLETE}" = "yes" ]; then
              echo "> [!WARNING]"
              echo "> **This release is incomplete.** One of the platform builds failed."
              echo "> Windows: \`${WINDOWS_RESULT}\` · macOS: \`${MACOS_RESULT}\`"
              echo
            fi
            echo "### Download"
            echo
            echo "| Platform | Download | Installs |"
            echo "|---|---|---|"
            if [ "${HAVE_WINDOWS_EXE}" = "yes" ]; then
              echo "| **Windows 10/11** | \`RecRoll-Windows-Universal-Installer.exe\` | VST3, CLAP, AAX, standalone |"
            fi
            if [ "${HAVE_MACOS}" = "yes" ]; then
              echo "| **macOS 11+** | \`RecRoll-macOS-Universal.dmg\` | VST3, AU, CLAP, AAX, standalone |"
            fi
            echo
            if [ "${HAVE_WINDOWS_EXE}" = "yes" ]; then
              echo "The Windows installer is one universal file for Intel/AMD and ARM64 machines."
              echo
            fi
            if [ "${HAVE_MACOS}" = "yes" ]; then
              echo "The macOS disk image is Universal 2 for Apple Silicon and Intel."
              echo
            fi
            if [ "${HAVE_WINDOWS_MSI}" = "yes" ]; then
              echo "<details><summary>Windows Installer packages (MSI)</summary>"
              echo
              echo "| Package | Architecture |"
              echo "|---|---|"
              echo "| \`RecRoll-*-Windows-x64.msi\` | Intel / AMD |"
              echo "| \`RecRoll-*-Windows-arm64.msi\` | Snapdragon X / ARM64 |"
              echo
              echo "</details>"
              echo
            fi
            echo "### Verification"
            echo
            echo "\`\`\`"
            cat release-files/SIGNING-*.txt 2>/dev/null || echo "No signing manifest available."
            echo "\`\`\`"
          } > release-notes.md

      - name: Evaluate pre-release
        id: kind
        env:
          REQUESTED: ${{ inputs.prerelease || github.event.client_payload.prerelease || 'false' }}
          INCOMPLETE: ${{ steps.notes.outputs.incomplete }}
        run: |
          if grep -qE '^[[:space:]]*Binaries[[:space:]]*: (developer-id|authenticode)' \
               release-files/SIGNING-*.txt 2>/dev/null; then
            SIGNED=yes
          else
            SIGNED=no
          fi

          if [ "${REQUESTED}" = "true" ] || [ "${INCOMPLETE}" = "yes" ] || [ "${SIGNED}" = "no" ]; then
            echo "flag=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Cleanup existing release
        if: ${{ inputs.replace_existing || github.event.client_payload.replace_existing }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          PRERELEASE="${{ steps.kind.outputs.flag }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists."
            exit 1
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "RecRoll $TAG" \
              --notes-file release-notes.md \
              $PRERELEASE \
              release-files/*
          fi
