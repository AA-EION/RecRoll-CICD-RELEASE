name: Release manifest

# Every release must carry release-manifest.json describing exactly its
# installers: the plug-in store and the EION Studios Launcher read only that
# file. This checks each release when it is published or edited (adding an
# installer or the manifest edits the release) and fails loudly when the
# manifest is missing or out of date. It reads this repository's own release
# through the GitHub API and calls nothing else.

on:
  release:
    types: [published, edited, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to check"
        required: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check release-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/verify_release_manifest.py --github "$TAG" --product recroll
